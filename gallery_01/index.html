<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kristine Servia" />
    <meta
      name="keywords"
      content="flashcard images, collections, index-cards"
    />
    <meta
      name="description"
      content="Florae is an interactive application where users can see a collection of Botanical illustrations by Ferdinand Bauer."
    />
    <title>Gallery 01: Florae</title>

    <link href="./assets/css/index.css" rel="stylesheet" />

    <link
      href="./assets/images/favicon_lily.png"
      rel="icon"
      type="image/x-icon"
    />

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="page">
    <!-- HEADER BLOCK -->
    <header class="header">
      <h1 class="header__title">
        <a href="" class="header__link">FLORAE</a>
      </h1>

      <!-- NAV BLOCK -->
      <nav class="nav">
        <ul class="nav__link">
          <li><a href="#about" class="nav__about-link">About</a></li>
        </ul>
      </nav>
    </header>

    <!-- GALLERY BLOCK -->
    <main class="gallery__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">
          Illustrations of the flora of New Holland
        </h2>

        <div class="gallery__list-wrapper">
          <ul class="gallery__list-container">
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-00.png"
                alt="specimen 00"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-01.png"
                alt="specimen 01"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-02.png"
                alt="specimen 02"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-03.png"
                alt="specimen 03"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-04.png"
                alt="specimen 04"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-05.png"
                alt="specimen 05"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-06.png"
                alt="specimen 06"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-07.png"
                alt="specimen 07"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-08.png"
                alt="specimen 08"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-09.png"
                alt="specimen 09"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-10.png"
                alt="specimen 10"
              />
            </li>
            <li class="gallery__thumbnail">
              <img
                src="./assets/images/illustration-11.png"
                alt="specimen 11"
              />
            </li>
          </ul>
        </div>

        <div></div>
      </section>
    </main>

    <!-- CARD TEMPLATE SECTION -->
    <template id="card-template" class="card__list-template">
      <li class="card">
        <h3 class="card__data"></h3>
        <div class="card__row">
          <button
            class="card__btn card__btn_type_flip"
            aria-label="Flip card button"
            type="button"
          ></button>
        </div>
      </li>
    </template>

    <!-- FOOTER SECTION -->
    <footer>
      <p class="footer__text">&copy; 2026 Florae</p>
    </footer>

    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
